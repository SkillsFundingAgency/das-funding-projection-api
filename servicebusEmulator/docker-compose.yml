name: funding-projection-api-servicebus-emulator
services:
  emulator:
    container_name: "funding-projection-api-servicebus-emulator"
    image: mcr.microsoft.com/azure-messaging/servicebus-emulator:latest
    volumes:
      - "./config.json:/ServiceBus_Emulator/ConfigFiles/Config.json"
    ports:
      - "5673:5672"
    environment:
      SQL_SERVER: funding-projection-api-sqledge
      MSSQL_SA_PASSWORD: P@55w0rd
      ACCEPT_EULA: Y
    depends_on:
      - sqledge
    networks:
      funding-projection-api-sb-emulator:
        aliases:
          - "funding-projection-api-sb-emulator"
  sqledge:
    container_name: "funding-projection-api-sqledge"
    image: "mcr.microsoft.com/azure-sql-edge:latest"
    networks:
      funding-projection-api-sb-emulator:
        aliases:
          - "funding-projection-api-sqledge"
    environment:
      ACCEPT_EULA: Y
      MSSQL_SA_PASSWORD: P@55w0rd
networks:
  funding-projection-api-sb-emulator:
